<input type="number" id="a">
<input type="number" id="b">

<select id="op">
    <option value="+">+</option>
    <option value="-">-</option>
    <option value="*">*</option>
    <option value="/">/</option>
</select>

<button onclick="calcular()">Calcular</button>

<p id="res"></p>

<script>
function calcular() {
    let a = parseFloat(document.getElementById("a").value);
    let b = parseFloat(document.getElementById("b").value);
    let op = document.getElementById("op").value;
    let r;

    switch(op) {
        case "+": r = a + b; break;
        case "-": r = a - b; break;
        case "*": r = a * b; break;
        case "/": r = a / b; break;
    }

    document.getElementById("res").innerText = "Resultado: " + r;
}
</script>
