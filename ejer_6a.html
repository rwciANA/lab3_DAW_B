<p id="texto">Hola mundo</p>

<button onclick="grande()">Grande</button>
<button onclick="pequeno()">Pequeño</button>
<button onclick="color()">Color</button>

<script>
function grande() {
    document.getElementById("texto").style.fontSize = "30px";
}

function pequeno() {
    document.getElementById("texto").style.fontSize = "15px";
}

function color() {
    document.getElementById("texto").style.color = "red";
}
</script>
